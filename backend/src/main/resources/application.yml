spring:
  application:
    name: foody-delivery
  datasource:
    url: jdbc:sqlite:foody.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite não suporta escrita concorrente; uma conexão evita "database is locked"
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      # A ordenação padrão do Hibernate 7 reordena colunas e, no dialeto SQLite, pode gerar
      # "id" sem tipo — que deixa de ser alias do rowid e fica NULL. "legacy" mantém a ordem declarada.
      hibernate.column_ordering_strategy: legacy

app:
  jwt:
    # Em produção, defina a variável de ambiente JWT_SECRET (Base64, mínimo 32 bytes)
    secret: ${JWT_SECRET:Zm9vZHktZGVsaXZlcnktZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Njc4OTA=}
    expiration: 8h
  cors:
    allowed-origins: http://localhost:5173
