services:
  # Nomes únicos (foody-*): no servidor, a rede do Traefik é compartilhada com outros projetos
  foody-api:
    build: ./backend
    image: foody-delivery-api
    container_name: foody-api
    restart: unless-stopped
    # Sem porta pública: só o Nginx do serviço web fala com a API, pela rede interna
    expose:
      - "8080"
    environment:
      # Obrigatório: o compose não sobe sem um segredo próprio (veja .env.example)
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - foody-data:/app/data
    healthcheck:
      # A imagem da JRE não tem curl: testa se a porta da API já aceita conexões
      # A imagem não tem curl: HTTP "na mão" pelo bash até o health check do Actuator (que verifica o banco)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  foody-web:
    build: ./frontend
    image: foody-delivery-web
    container_name: foody-web
    restart: unless-stopped
    depends_on:
      foody-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  # Banco SQLite persistido fora do container (sobrevive a rebuilds e restarts)
  foody-data:
