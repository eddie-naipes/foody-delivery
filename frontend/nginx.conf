# Atrás de outro proxy (ex.: Traefik com HTTPS), mantém o protocolo original; sozinho, usa o próprio
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

log_format with_request_id '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                           '"$http_user_agent" request_id=$request_id';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log with_request_id;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mesma origem: o navegador só fala com o Nginx, que repassa a API (sem CORS).
    # Também a documentação interativa (Swagger UI e o OpenAPI que ela lê). O /actuator
    # não é repassado: health check e métricas ficam só dentro da rede do Docker.
    location ~ ^/(api/|swagger-ui|v3/api-docs) {
        proxy_pass http://foody-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # O mesmo id no log do Nginx e em todas as linhas de log da API para esta requisição
        proxy_set_header X-Request-Id $request_id;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do React (/pedidos/1, /login...) caem no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
