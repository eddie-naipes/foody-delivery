# Atrás de outro proxy (ex.: Traefik com HTTPS), mantém o protocolo original; sozinho, usa o próprio
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mesma origem: o navegador só fala com o Nginx, que repassa a API (sem CORS)
    location /api/ {
        proxy_pass http://foody-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do React (/pedidos/1, /login...) caem no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
